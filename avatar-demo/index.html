    <div class="side-head">
      <h2 class="side-title">Settings</h2>
      <button class="btn btn-tertiary btn-sq btn-sm" id="close-settings" type="button" aria-label="Close settings">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>
    <div class="side-scroll thin-scroll">
      <section class="group">
        <h2 class="group-title" id="convo-label">Conversation</h2>
        <div class="switch" id="convo" role="radiogroup" aria-labelledby="convo-label" aria-describedby="convo-help">
          <button type="button" class="opt" role="radio" aria-checked="true" data-value="office">Office</button>
          <button type="button" class="opt" role="radio" aria-checked="false" data-value="vacation">Vacation</button>
        </div>
        <p class="help" id="convo-help">Plays when you start a call.</p>
      </section>
      <section class="group">
        <h2 class="group-title">Display</h2>
        <label class="field-label" id="ratio-label">Aspect ratio</label>
        <div class="switch" id="ratio" role="radiogroup" aria-labelledby="ratio-label">
          <button type="button" class="opt" role="radio" aria-checked="true" data-value="1:1">1:1</button>
          <button type="button" class="opt" role="radio" aria-checked="false" data-value="4:3">4:3</button>
          <button type="button" class="opt" role="radio" aria-checked="false" data-value="3:4">3:4</button>
        </div>
        <label class="field-label" id="main-view-label">Main view</label>
        <div class="switch" id="main-view" role="radiogroup" aria-labelledby="main-view-label" aria-describedby="main-view-help">
          <button type="button" class="opt" role="radio" aria-checked="true" data-value="avatar">Avatar</button>
          <button type="button" class="opt" role="radio" aria-checked="false" data-value="camera">Self view</button>
        </div>
        <p class="help" id="main-view-help">Which one fills the frame when your camera is on. Tap the small picture to swap.</p>
        <label class="field-label" id="timer-label">Call timer</label>
        <div class="switch" id="timer-mode" role="radiogroup" aria-labelledby="timer-label">
          <button type="button" class="opt" role="radio" aria-checked="true" data-value="on">On</button>
          <button type="button" class="opt" role="radio" aria-checked="false" data-value="off">Off</button>
        </div>
      </section>
    </div>
    <footer class="side-foot">
      <span class="status" id="status-chip" role="status" aria-live="polite">Idle</span>
      <div class="row-gap">
        <button class="btn btn-tertiary btn-sq btn-sm" id="theme-btn" type="button" aria-label="Switch theme" title="Switch theme">
          <svg class="sun" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3.25"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.06 1.06M11.54 11.54l1.06 1.06M3.4 12.6l1.06-1.06M11.54 4.46l1.06-1.06"/></svg>
          <svg class="moon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/></svg>
        </button>
      </div>
    </footer>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
</div>
<script src="app.js?v=6"></script>
</body>
</html>
